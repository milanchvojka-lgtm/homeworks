name: Cron jobs

# Cron infrastructure pro Homeworks (viz DECISIONS.md D1).
# Volá `/api/cron/*` endpointy na Vercelu s `CRON_SECRET` headerem.
#
# Repo secrets potřebné v Settings → Secrets and variables → Actions:
#   DEPLOY_URL    — kořenová URL produkčního Vercel deploye
#   CRON_SECRET   — sdílený secret, identický s `CRON_SECRET` env na Vercelu
#
# Cron expressions GitHub Actions interpretuje v UTC; každý handler je
# idempotentní + uvnitř si timezone-aware kontroly dělá sám (viz D5).
# Dvojí spuštění (zima/léto offset) handlerům nevadí — operace jsou idempotentní.
# D21: uzávěrky zavírají jen už skončená období (dny před dneškem, předchozí týden,
# předchozí měsíc), takže je jedno, kdy a kolikrát GitHub úlohu spustí (zpoždění 2 h+).

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Cron endpoint to ping (without /api/cron/ prefix)"
        required: true
        default: "health"
  schedule:
    # daily-rollover: 00:05 Prague (23:05 UTC zima / 22:05 UTC léto); přiřadí i dnešní role (D32)
    - cron: "5 23 * * *"
    - cron: "5 22 * * *"
    # daily-close + monthly-close: 00:15 Prague (23:15 UTC zima / 22:15 UTC léto), D21
    - cron: "15 23 * * *"
    - cron: "15 22 * * *"
    # weekly-close: Mon 00:20 Prague (Sun 23:20 UTC zima / Sun 22:20 UTC léto), D21
    - cron: "20 23 * * 0"
    - cron: "20 22 * * 0"
    # recurring-tasks: 06:00 Prague (05:00 UTC zima / 04:00 UTC léto)
    - cron: "0 5 * * *"
    - cron: "0 4 * * *"
    # admin-digest + claim-timeout + reminders (D28): každých 15 minut
    - cron: "*/15 * * * *"

jobs:
  manual:
    name: Manual ping ${{ github.event.inputs.endpoint }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_URL }}" ]; then echo "::error::DEPLOY_URL not set"; exit 1; fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then echo "::error::CRON_SECRET not set"; exit 1; fi
      - name: Call endpoint
        env:
          ENDPOINT: ${{ github.event.inputs.endpoint }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DEPLOY_URL }}/api/cron/${ENDPOINT}"; echo

  scheduled:
    name: Scheduled (${{ github.event.schedule }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sanity check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_URL }}" ]; then echo "::error::DEPLOY_URL not set"; exit 1; fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then echo "::error::CRON_SECRET not set"; exit 1; fi
      - name: Route schedule → endpoint(s)
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          ENDPOINTS=""
          # INDEPENDENT=1: endpoints do not depend on each other, so a failing one must not skip the rest
          # (D28: reminders must run even when claim-timeout or admin-digest fails). The job still fails at the end.
          # daily-close → monthly-close stays fail-fast: the monthly bonus must not run on unclosed days.
          INDEPENDENT=0
          case "${SCHEDULE}" in
            "5 23 * * *"|"5 22 * * *")   ENDPOINTS="daily-rollover" ;;
            "15 23 * * *"|"15 22 * * *") ENDPOINTS="daily-close monthly-close" ;;
            "20 23 * * 0"|"20 22 * * 0") ENDPOINTS="weekly-close" ;;
            "0 5 * * *"|"0 4 * * *")     ENDPOINTS="recurring-tasks" ;;
            "*/15 * * * *")              ENDPOINTS="reminders claim-timeout admin-digest"; INDEPENDENT=1 ;;
            *) echo "::error::Unknown schedule: ${SCHEDULE}"; exit 1 ;;
          esac
          FAILED=""
          for E in $ENDPOINTS; do
            echo "Schedule ${SCHEDULE} → /api/cron/${E}"
            if ! curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.DEPLOY_URL }}/api/cron/${E}"; then
              echo "::error::/api/cron/${E} failed"
              [ "${INDEPENDENT}" = "1" ] || exit 1
              FAILED="${FAILED} ${E}"
            fi
            echo
          done
          if [ -n "${FAILED}" ]; then echo "::error::Failed:${FAILED}"; exit 1; fi
